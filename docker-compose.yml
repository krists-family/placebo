services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: placebo
      POSTGRES_DB: placebo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U placebo -d placebo]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  medusa:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://placebo:${POSTGRES_PASSWORD}@postgres:5432/placebo
      REDIS_URL: redis://redis:6379
      MEDUSA_PUBLIC_URL: ${MEDUSA_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ['9000:9000']
    volumes:
      - product-uploads:/app/.medusa/server/static
  storefront:
    build: .
    restart: unless-stopped
    env_file: ./.env.local
    environment:
      COMMERCE_MODE: medusa
      MEDUSA_BACKEND_URL: http://medusa:9000
      MEDUSA_ADMIN_URL: ${MEDUSA_PUBLIC_URL:-http://localhost:9000}/app
    depends_on: [medusa]
    ports: ['3000:3000']
volumes:
  postgres-data:
  redis-data:
  product-uploads:
